<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bun 1.4 Rust versus Bun 1.3.14 Zig benchmark results</title>
  <desc id="desc">Three bar charts compare startup time, HTTP throughput, and 128 MiB StreamDrop relay performance.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; }
    .sub { font-size: 17px; fill: #59647a; }
    .panel { font-size: 22px; font-weight: 650; }
    .label { font-size: 17px; }
    .value { font-size: 17px; font-weight: 650; }
    .zig { fill: #8b95a7; }
    .rust { fill: #e96b3c; }
    .grid { stroke: #dce1e8; stroke-width: 1; }
  </style>
  <text x="70" y="62" class="title">Bun 1.4: Rust release benchmarked</text>
  <text x="70" y="92" class="sub">Bun 1.3.14 vs 1.4.2 · Linux ARM64 Docker · Apple M1 Max · medians</text>
  <rect x="850" y="43" width="18" height="18" rx="3" class="zig"/><text x="879" y="58" class="label">1.3.14 Zig</text>
  <rect x="1002" y="43" width="18" height="18" rx="3" class="rust"/><text x="1031" y="58" class="label">1.4.2 Rust</text>

  <text x="70" y="150" class="panel">Startup time ↓</text>
  <line x1="285" y1="180" x2="285" y2="310" class="grid"/>
  <text x="70" y="216" class="label">Empty script</text>
  <rect x="285" y="188" width="550" height="32" rx="4" class="zig"/><text x="850" y="211" class="value">9.264 ms</text>
  <rect x="285" y="242" width="138" height="32" rx="4" class="rust"/><text x="438" y="265" class="value">2.326 ms</text>
  <text x="285" y="302" class="value">3.98× faster</text>

  <text x="70" y="365" class="panel">HTTP throughput ↑</text>
  <text x="70" y="414" class="label">Plain text</text>
  <rect x="285" y="387" width="453" height="26" rx="4" class="zig"/><text x="750" y="407" class="value">143,869 req/s</text>
  <rect x="285" y="420" width="490" height="26" rx="4" class="rust"/><text x="787" y="440" class="value">155,497 req/s · +8.1%</text>
  <text x="70" y="486" class="label">JSON response</text>
  <rect x="285" y="459" width="382" height="26" rx="4" class="zig"/><text x="679" y="479" class="value">121,292 req/s</text>
  <rect x="285" y="492" width="448" height="26" rx="4" class="rust"/><text x="745" y="512" class="value">142,272 req/s · +17.3%</text>

  <text x="70" y="580" class="panel">128 MiB StreamDrop relay</text>
  <text x="70" y="625" class="label">Throughput</text>
  <rect x="285" y="598" width="329" height="26" rx="4" class="zig"/><text x="626" y="618" class="value">621 MiB/s</text>
  <rect x="285" y="631" width="500" height="26" rx="4" class="rust"/><text x="797" y="651" class="value">943 MiB/s · +51.9%</text>
  <text x="70" y="701" class="label">Peak RSS</text>
  <rect x="285" y="674" width="500" height="26" rx="4" class="zig"/><text x="797" y="694" class="value">117.8 MiB</text>
  <rect x="285" y="707" width="290" height="26" rx="4" class="rust"/><text x="587" y="727" class="value">68.2 MiB · −42.1%</text>
</svg>
